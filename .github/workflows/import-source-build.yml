name: Import Source and Build APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-source-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out new repository
        uses: actions/checkout@v4
      - name: Extract Android project sources
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap/source.tar.xz.b64 | tar -xJf -
          test -f app/build.gradle
          test -f .github/workflows/build-apk.yml
          test -f app/src/main/java/com/futurecode/autovideocutter/MainActivity.java
          rm .bootstrap/source.tar.xz.b64
          rmdir .bootstrap || true
      - name: Commit source files to main branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet || git commit -m "Import Future Code Auto Video Cutter Android source"
          git push origin HEAD:main
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FutureCodeAutoVideoCutter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# Retry source import after installing the build workflow.
